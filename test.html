




  <!-- modify this form HTML and place wherever you want your form -->
<form
  action="https://usebasin.com/f/ab33c16bc392"
  method="POST"
  enctype="multipart/form-data"
>

  <!-- Prevent spam bots -->
  <input type="hidden" name="_gotcha">

  <!-- Job Position -->
  <input
    type="hidden"
    name="Position"
    id="position"
    value="Software Engineer"
  >

  <!-- Name -->
  <div class="form-group">
    <label for="name">Full Name *</label>
    <input
      type="text"
      id="name"
      name="Full Name"
      required
      autocomplete="name"
    >
  </div>

  <!-- Email -->
  <div class="form-group">
    <label for="email">Email Address *</label>
    <input
      type="email"
      id="email"
      name="Email"
      required
      autocomplete="email"
    >
  </div>

  <!-- Phone -->
  <div class="form-group">
    <label for="phone">Phone Number *</label>
    <input
      type="tel"
      id="phone"
      name="Phone"
      required
      autocomplete="tel"
    >
  </div>

  <!-- Experience -->
  <div class="form-group">
    <label for="experience">Years of Experience *</label>
    <select
      id="experience"
      name="Experience"
      required
    >
      <option value="">Select</option>
      <option>Fresher</option>
      <option>0-1 Years</option>
      <option>1-3 Years</option>
      <option>3-5 Years</option>
      <option>5+ Years</option>
    </select>
  </div>

  <!-- Resume -->
  <div class="form-group">
    <label for="resume">Resume *</label>
    <input
      type="file"
      id="resume"
      name="Resume"
      accept=".pdf,.doc,.docx"
      required
    >
  </div>

  <!-- Cover Letter -->
  <div class="form-group">
    <label for="message">Cover Letter (Optional)</label>
    <textarea
      id="message"
      name="Cover Letter"
      rows="5"
      placeholder="Tell us briefly why you'd like to join Abhinnovation."
    ></textarea>
  </div>

  <button type="submit">
    Submit Application
  </button>

</form>
